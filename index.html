<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem('bcrea-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<title>B.Crea · Gestion boutique</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3f0; --panel:#fffdfb; --field:#fff; --line:#e9dfd9; --line2:#f2ebe7; --head:#f6efeb;
    --text:#1f1b1c; --muted:#8a7b7f; --accent:#b8687f; --accent-dark:#94485f; --accent-soft:#f6e5ea; --accent-2:#e7b9c6; --on-accent:#fff;
    --good:#3f8a63; --good-soft:#e6f2ea; --warn:#a8641a; --warn-soft:#fbefdf; --warn-line:#efd6b5;
    --bad:#b8423a; --bad-soft:#f9e6e3; --info:#7b5aa6; --info-soft:#f0eaf7; --sel:#b8687f;
    --shadow:0 1px 2px rgba(60,40,45,.04),0 4px 14px rgba(60,40,45,.04); --overlay:rgba(40,28,32,.42);
    color-scheme:light;
  }
  html[data-theme=dark]{
    --bg:#171315; --panel:#211c1e; --field:#2a2427; --line:#3a3135; --line2:#2d2629; --head:#282225;
    --text:#f2eaec; --muted:#a5959b; --accent:#e29ab0; --accent-dark:#f0b8c8; --accent-soft:#3b2a31; --accent-2:#8a4b5f; --on-accent:#2a1820;
    --good:#7bc89c; --good-soft:#1f3328; --warn:#efb565; --warn-soft:#382c1c; --warn-line:#5a4526;
    --bad:#f08f86; --bad-soft:#3d2423; --info:#c4a3ea; --info-soft:#30263c; --sel:#e29ab0;
    --shadow:none; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
  html[data-theme=dark] .brand img{filter:invert(1) sepia(.15)}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px 0;position:sticky;top:0;z-index:5}
  .hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:60px;width:auto;display:block}
  .brand .sep{width:1px;height:30px;background:var(--line)}
  h1{margin:0;font-family:'Bodoni Moda',serif;font-weight:500;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--text)}
  .ico{display:inline-block;vertical-align:-3px;flex:none}
  .iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;cursor:pointer;color:var(--text)}
  .iconbtn:hover{background:var(--head)}
  .sync{display:inline-flex;align-items:center;gap:6px}
  .card h2,.modal .mh h3{font-family:'Bodoni Moda',serif;font-weight:600;letter-spacing:.01em}
  .card h2{font-size:15px} .modal .mh h3{font-size:18px}
  .card h2 .ico{color:var(--accent)}
  nav a{display:inline-flex;align-items:center;gap:7px}
  .kpi,.sheet,.card{box-shadow:var(--shadow)}
  .thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;display:block;border:1px solid var(--line);cursor:pointer;background:var(--head)}
  .thumb.ph{display:grid;place-items:center;color:var(--muted);border-style:dashed;background:transparent}
  .thumb.ph:hover{color:var(--accent);border-color:var(--accent)}
  .phbtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;flex:none}
  .phbtn:hover{background:var(--accent);color:var(--on-accent)}
  td.phcell{padding:0 8px;width:1%}
  .namecell{display:flex;align-items:center;gap:8px;padding-left:8px}
  .namecell .cell{padding-left:2px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .pgrid figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--head);position:relative}
  .pgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .pgrid figcaption{display:flex;gap:4px;padding:6px;justify-content:space-between;align-items:center}
  .pgrid .main{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
  .drop{border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;aspect-ratio:1;color:var(--muted);cursor:pointer;font-size:13px;gap:6px;padding:10px}
  .drop:hover,.drop.over{border-color:var(--accent);color:var(--accent)}
  .ctrl .btn{width:auto;height:28px;font-size:12px;font-weight:500;color:var(--text)}
  .detbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap;max-width:230px;overflow:hidden}
  .detbtn:hover{border-color:var(--accent);color:var(--accent)}
  .detbtn .ico{color:var(--accent)}
  .szchips{display:inline-flex;gap:3px;flex-wrap:nowrap}
  .szc{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);line-height:17px}
  .szc.zero{opacity:.45;text-decoration:line-through}
  .sztable td{height:42px}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .switch{position:relative;width:34px;height:20px;display:inline-block;vertical-align:middle}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.15s}
  .switch span:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--field);border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked+span{background:var(--accent)}
  .switch input:checked+span:before{transform:translateX(14px)}
  .sync{font-size:12px;color:var(--muted);margin-left:auto}
  nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
  nav a{padding:9px 14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
  nav a .cnt[hidden]{display:none}
  nav a.on{color:var(--accent);border-bottom-color:var(--accent)}
  nav a .cnt{display:inline-block;margin-left:6px;background:var(--warn-soft);color:var(--warn);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
  main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)}
  .alert{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
  .alert-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .alert b{color:var(--warn)}
  .alert ul{margin:8px 0 0;padding-left:18px} .alert li{margin:2px 0}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .toolbar .right{margin-left:auto;display:flex;gap:8px}
  input,select,button,textarea{font:inherit;color:inherit}
  .search,.inp{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
  .search{min-width:220px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--field)}
  .seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--head)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.danger{color:var(--bad)}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{border-collapse:collapse;width:100%}
  .sheet table{min-width:900px}
  th,td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;height:38px;text-align:left;white-space:nowrap}
  th:last-child,td:last-child{border-right:0}
  thead th{background:var(--head);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:0 10px}
  thead tr.letters th{height:22px;font-weight:500;color:var(--muted);text-align:center;font-size:11px}
  td.rownum,th.rownum{width:40px;text-align:center;background:var(--head);color:var(--muted);font-size:12px}
  td.pad{padding:0 10px} td.r,th.r{text-align:right} td.r{padding:0 10px;font-variant-numeric:tabular-nums}
  tfoot td{background:var(--head);font-weight:600;padding:0 10px}
  .cell{width:100%;height:38px;border:2px solid transparent;background:transparent;padding:0 8px;outline:none}
  .cell:focus{border-color:var(--sel);background:var(--field)}
  .cell.num{text-align:right;font-variant-numeric:tabular-nums}
  td.stock{text-align:right;padding:0 10px;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .ok{background:var(--good-soft);color:var(--good)}
  .low{background:var(--warn-soft);color:var(--warn)}
  .out{background:var(--bad-soft);color:var(--bad)}
  .info{background:var(--info-soft);color:var(--info)}
  .grey{background:var(--head);color:var(--muted)}
  tr.r-low td.stock{color:var(--warn)} tr.r-out td.stock{color:var(--bad)}
  .ctrl{display:flex;align-items:center;gap:4px;padding:0 8px}
  .ctrl button{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:pointer;font-size:16px;font-weight:600;line-height:1}
  .ctrl button.minus{color:var(--bad)} .ctrl button.plus{color:var(--good)}
  .ctrl button:hover{background:var(--head)}
  .ctrl input{width:52px;height:28px;border:1px solid var(--line);border-radius:6px;text-align:center}
  .del{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 10px;font-size:15px}
  .del:hover{color:var(--bad)}
  .link{border:0;background:none;color:var(--info);cursor:pointer;padding:0;font-weight:500}
  .link:hover{text-decoration:underline}
  tr.add td{background:var(--head);padding:0 4px}
  tr.add .cell{border:1px dashed var(--line);border-radius:4px;height:30px;margin:4px 0}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--head)}
  .empty{padding:30px;text-align:center;color:var(--muted);white-space:normal}
  .bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  tr.r-low .bar i{background:#e8a33d} tr.r-out .bar i{background:var(--bad)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:14px}
  .card h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
  .card .body{padding:12px 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid2 .card{margin-top:0}
  .hist{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
  .hist li{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:13px}
  .hist .d{font-weight:600;width:52px;text-align:right;font-variant-numeric:tabular-nums}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .hist .t{color:var(--muted);margin-left:auto}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
  .hbar .lab{width:110px} .hbar .track{flex:1;height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
  .hbar .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
  .hbar .val{width:110px;text-align:right;font-variant-numeric:tabular-nums}
  .files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--field);font-size:12px;max-width:220px;text-decoration:none;color:inherit}
  .chip img{width:26px;height:26px;object-fit:cover;border-radius:3px}
  .chip .ic{width:26px;height:26px;border-radius:3px;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-size:9px;font-weight:700}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px}
  .clip{color:var(--muted);font-size:12px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .banner{display:none;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px}
  .banner.show{display:block}
  /* modal */
  .ov{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .ov.show{display:flex}
  .modal{background:var(--field);border-radius:14px;width:100%;max-width:760px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .modal .mh{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
  .modal .mh h3{margin:0;font-size:16px}
  .modal .mh .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .modal .mb{padding:16px 18px}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
  label.f .inp,label.f textarea{color:var(--text);font-size:14px}
  textarea.inp{min-height:60px;resize:vertical}
  .lines{width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
  .lines th{height:30px} .lines td{height:40px;padding:0 6px}
  .lines .inp{width:100%;padding:5px 8px}
  .tot{font-size:16px;font-weight:600;text-align:right;margin:6px 0 12px}
  .sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
  .mini{width:100%;border:1px solid var(--line2);border-radius:6px}
  .mini td,.mini th{height:38px;padding:0 8px;font-size:13px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
  .warnline{color:var(--warn);font-size:12px}
  @media (max-width:800px){.grid2{grid-template-columns:1fr}}
</style>
</head>

    function draw(){
      $('#ps-sizes').innerHTML=sizes.length?sizes.map((z,i)=>`<tr data-i="${i}"><td><input class="inp" data-t value="${esc(z.t)}" style="width:100%"></td>
        ${tr?`<td><div class="ctrl" style="padding:0"><button class="minus" data-d="-1">−</button><input type="number" min="0" data-st value="${z.stock}"><button class="plus" data-d="1">+</button></div></td>`:''}

        :`<tr><td colspan="3" class="clip" style="padding:10px">Aucune taille (taille unique).</td></tr>`;
    }
    draw();
    const addSize=t=>{t=String(t).trim();if(!t)return;if(sizes.some(z=>z.t.toLowerCase()===t.toLowerCase()))return;sizes.push({t,stock:0,orig:0})};

    $('#modal').querySelector('.presets').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(!b)return;PRESETS[b.dataset.preset].forEach(addSize);draw()});
    const tb=$('#ps-sizes');
    tb.addEventListener('click',e=>{const row=e.target.closest('tr[data-i]');if(!row)return;const z=sizes[+row.dataset.i];
      const d=e.target.closest('[data-d]');if(d){z.stock=Math.max(0,z.stock+num(d.dataset.d));row.querySelector('[data-st]').value=z.stock;return}
      if(e.target.closest('[data-rmz]')){sizes.splice(+row.dataset.i,1);draw()}});
    tb.addEventListener('change',e=>{const row=e.target.closest('tr[data-i]');if(!row)return;const z=sizes[+row.dataset.i];
      if(e.target.hasAttribute('data-t')){const v=e.target.value.trim();if(v)z.t=v;else e.target.value=z.t}
      if(e.target.hasAttribute('data-st'))z.stock=Math.max(0,num(e.target.value))});
    $('#ps-save').addEventListener('click',async()=>{
      const desc=$('#ps-desc').value.trim();
      if(isDraft){draftSheet={desc,sizes:sizes.map(z=>({t:z.t,stock:z.stock}))};toast('Sera ajouté avec le nouvel élément');closeModal();return}
      const had=hasSizes(p),before=num(p.stock);
      p.desc=desc;p.sizes=sizes.map(z=>({t:z.t,stock:z.stock}));
      const patch={desc,sizes:p.sizes};
      if(tr&&p.sizes.length){p.stock=sumSizes(p);patch.stock=p.stock;if(!had&&!num(p.initial))patch.initial=p.initial=p.stock}
      await dbUpdate(col,p.id,patch);
      if(tr&&p.sizes.length){for(const z of sizes){const d=round2(z.stock-z.orig);if(d)await logMove(p,d,p.stock,'Taille '+z.t+' · ajustement')}
        if(!had&&before&&before!==p.stock)toast('Stock du produit recalculé : '+p.stock+' (somme des tailles)');}
      toast('Fiche enregistrée');closeModal();
    });
  }
  function delPhotos(p){if(assets)(p.photos||[]).forEach(f=>assets.delete(f.id).catch(()=>{}))}

  /* ================= écriture base ================= */
  async function dbSet(col,id,data){if(!db)return;try{await db.collection(col).doc(id).set(data)}catch(e){toast(e&&e.code==='quota_exceeded'?'Base pleine':'Erreur de sauvegarde')}}
  async function dbUpdate(col,id,patch){if(!db)return;try{await db.collection(col).doc(id).update(patch)}catch(e){toast('Erreur de sauvegarde')}}
  async function dbDel(col,id){if(!db)return;try{await db.collection(col).doc(id).delete()}catch(e){toast('Erreur de suppression')}}
  function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function strip(o){const c={...o};delete c.id;return c}
  function upsertLocal(arr,o){const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o)}

  async function logMove(p,delta,after,why){
    const mv={productId:p.id,name:p.name,delta,after,why:why||'',kind:materials.includes(p)?'mat':'prod',unit:p.unit||'',at:new Date().toISOString()};
    if(db){try{await db.collection('movements').add(mv)}catch(e){}}else{moves.unshift(mv)}
  }
  async function changeStock(p,delta,why,size){
    if(p.inStock===false)return 0;
    if(size&&hasSizes(p)){const z=p.sizes.find(x=>x.t===size);
      if(z){const za=Math.max(0,num(z.stock)+delta),real=za-num(z.stock);p.sizes=p.sizes.map(x=>x===z?{t:x.t,stock:za}:x);p.stock=sumSizes(p);
        await dbUpdate('products',p.id,{sizes:p.sizes,stock:p.stock,updatedAt:new Date().toISOString()});await logMove(p,real,p.stock,why+' · taille '+size);return real}}
    const after=Math.max(0,num(p.stock)+delta);const real=after-num(p.stock);
    p.stock=after;
    await dbUpdate('products',p.id,{stock:after,updatedAt:new Date().toISOString()});
    await logMove(p,real,after,why);
    return real;
  }

    ({stock:rStock,materiel:rMat,tarifs:rTarifs,devis:rDev,commandes:rCmd,paiements:rPay,recap:rRecap}[view]||rStock)(v);
    Object.entries(keep).forEach(([id,val])=>{const i=document.getElementById(id);if(i){if(i.type==='checkbox')i.checked=val;else if(val!==''&&i.value==='')i.value=val}});

  function safeRender(){

      <tbody id="rows">${!list.length?`<tr><td colspan="11" class="empty">${TP.length?'Aucun produit ne correspond.':'Aucun produit suivi en stock. Ajoutez-en un ci-dessous, ou activez « Suivi stock » dans l\'onglet Tarifs.'}</td></tr>`:
      list.map((p,i)=>{const st=status(p),s=liveStock(p),pct=Math.max(0,Math.min(100,s/Math.max(num(p.initial),1)*100));
        return `<tr class="r-${st}" data-id="${esc(p.id)}"><td class="rownum">${i+1}</td>

    <div class="card"><h2>${ic('box')} Historique des mouvements</h2><ul class="hist">${!moves.filter(m=>m.kind!=='mat').length?'<li style="color:var(--muted)">Aucun mouvement pour l\'instant.</li>':
      moves.filter(m=>m.kind!=='mat').slice(0,40).map(m=>{const d=num(m.delta),dt=new Date(m.at);const when=isNaN(dt)?'':dt.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      return `<li><span class="d ${d>=0?'pos':'neg'}">${d>0?'+':''}${d}</span><span>${esc(m.name)}</span><span style="color:var(--muted)">→ stock ${num(m.after)}${m.why?' · '+esc(m.why):''}</span><span class="t">${when}</span></li>`}).join('')}</ul></div>`;

  function bump(id,delta){
    const p=findItem(id);if(!p)return;
    const cur=pending[id]||(pending[id]={delta:0,timer:null});
    if(liveStock(p)+delta<0){delta=-liveStock(p);if(!delta){toast('Stock déjà à 0');return}}
    cur.delta+=delta;render();clearTimeout(cur.timer);cur.timer=setTimeout(()=>flush(id),600);
  }
  async function flush(id){
    const cur=pending[id];if(!cur)return;const p=findItem(id),d=cur.delta;delete pending[id];
    if(!p||!d){render();return}
    const after=round2(num(p.stock)+d);p.stock=after;const col=colOf(p);
    await dbUpdate(col,id,{stock:after,updatedAt:new Date().toISOString()});
    await logMove(p,d,after,col==='materials'?(d>0?'Achat / réassort':'Utilisé'):(d>0?'Réassort':'Sortie manuelle'));render();

  async function setStatut(o,st){
    if(o.statut===st)return;

    if(st==='Annulée'&&o.stockDeducted){await restock(o,'Annulation #'+o.num);o.stockDeducted=false}
    else if(wasCancel&&!o.stockDeducted){await destock(o);o.stockDeducted=true}
    await dbSet('orders',o.id,strip(o));toast('Commande #'+o.num+' : '+st);render();
  }
  async function destock(o){
    for(const it of (o.items||[])){const p=byId(products,it.productId);if(!p){it.deducted=0;continue}
      it.deducted=-(await changeStock(p,-num(it.qty),'Commande #'+o.num+' · '+(o.client||''),it.size));}
  }
  async function restock(o,why){
    for(const it of (o.items||[])){const p=byId(products,it.productId);const q=num(it.deducted,num(it.qty));if(p&&q>0)await changeStock(p,q,why,it.size);it.deducted=0}
  }

  /* ---------- RÉCAP ---------- */
  function inPeriod(dstr){
    if(ui.period==='all')return true;
    const d=new Date(String(dstr).slice(0,10)+'T12:00:00');if(isNaN(d))return false;const n=new Date();
    if(ui.period==='month')return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
    if(ui.period==='prev'){const p=new Date(n.getFullYear(),n.getMonth()-1,1);return d.getFullYear()===p.getFullYear()&&d.getMonth()===p.getMonth()}
    if(ui.period==='year')return d.getFullYear()===n.getFullYear();
    return true;
  }
  function rRecap(v){
    const ords=orders.filter(o=>o.statut!=='Annulée'&&inPeriod(o.date));
    const pays=payments.filter(p=>inPeriod(p.date));
    const ca=ords.reduce((a,o)=>a+orderTotal(o),0),cost=ords.reduce((a,o)=>a+orderCost(o),0),enc=pays.reduce((a,p)=>a+num(p.montant),0);
    const missingCost=ords.some(o=>(o.items||[]).some(i=>!num(i.achat)));
    const allDue=orders.filter(o=>o.statut!=='Annulée').map(o=>({o,r:round2(orderTotal(o)-paidFor(o))})).filter(x=>x.r>0.005).sort((a,b)=>String(a.o.date).localeCompare(String(b.o.date)));
    const byMode={};pays.forEach(p=>byMode[p.mode]=(byMode[p.mode]||0)+num(p.montant));
    const modeRows=Object.entries(byMode).sort((a,b)=>b[1]-a[1]);const maxM=Math.max(1,...modeRows.map(x=>x[1]));
    const byProd={};ords.forEach(o=>(o.items||[]).forEach(i=>{const k=i.name;byProd[k]=byProd[k]||{q:0,ca:0};byProd[k].q+=num(i.qty);byProd[k].ca+=num(i.qty)*num(i.prix)}));
    const prodRows=Object.entries(byProd).sort((a,b)=>b[1].ca-a[1].ca).slice(0,8);const maxP=Math.max(1,...prodRows.map(x=>x[1].ca));
    const cl=clients().map(c=>{const os=orders.filter(o=>o.client===c&&o.statut!=='Annulée');const ps=payments.filter(p=>p.client===c);
      const tot=os.reduce((a,o)=>a+orderTotal(o),0),paid=os.reduce((a,o)=>a+paidFor(o),0)+ps.filter(p=>!p.orderId).reduce((a,p)=>a+num(p.montant),0);
      const nf=os.reduce((a,o)=>a+(o.files||[]).length,0)+ps.reduce((a,p)=>a+(p.files||[]).length,0);
      const last=[...os.map(o=>o.date),...ps.map(p=>p.date)].sort().pop();
      return{c,n:os.length,tot,paid,reste:Math.max(0,tot-paid),nf,last}}).sort((a,b)=>b.tot-a.tot);
    const per={month:'Ce mois-ci',prev:'Mois dernier',year:'Cette année',all:'Depuis le début'};
    v.innerHTML=`

  /* --- lecture de l'e-mail Web3Forms --- */
  const KEYS=['Article','Entreprise','Contact','Prénom','Nom','Email','E-mail','Téléphone','Support','Besoin','Quantité','Budget','SIRET','Occasion','Pour','Réception','Idée','Message','Name','Phone'];
  function parseMail(txt){
    const lines=String(txt||'').replace(/\r/g,'').split('\n');const out={};let cur=null;
    const re=new RegExp('^\\s*\\*?\\s*('+KEYS.join('|')+')\\s*\\*?\\s*[:：]\\s*(.*)$','i');
    for(const raw of lines){
      const m=raw.match(re);
      if(m){const k=KEYS.find(x=>x.toLowerCase()===m[1].toLowerCase());cur=k;if(out[k]===undefined||(k==='Email'&&!out[k]))out[k]=m[2].trim();else if(k!=='Email'&&k!=='Name')out[k]+=' '+m[2].trim();continue}
      if(cur==='Idée'&&raw.trim()&&!/web3forms|^-{3,}|^_{3,}/i.test(raw))out['Idée']+=(out['Idée']?'\n':'')+raw.trim();
      else if(!raw.trim()&&cur!=='Idée')cur=null;
    }
    const pro=!!out.Entreprise;
    const email=(out.Email||out['E-mail']||'').match(/[^\s<>()"]+@[^\s<>()"]+\.[^\s<>()".,;]+/);
    let support=out.Support||'',qte=out['Quantité']||'';
    const mq=support.match(/\(\s*[×x]\s*(\d+)\s*\)\s*$/);if(mq){qte=qte||mq[1];support=support.replace(mq[0],'').trim()}
    const subject=out.Article?('Boutique : '+out.Article):pro?(out.Besoin||'Demande professionnelle'):(support||'Personnalisation');
    const name=out['Prénom']||out.Contact||out.Nom||out.Name||'';
    const det=[out.Article&&'Article : '+out.Article,pro&&'Entreprise : '+out.Entreprise,name&&((pro?'Contact : ':'Prénom : ')+name),out.Besoin&&'Besoin : '+out.Besoin,support&&'Support : '+support,qte&&'Quantité : '+qte,out.Budget&&'Budget : '+out.Budget,out.Occasion&&'Occasion : '+out.Occasion,out.Pour&&'Pour : '+out.Pour,out['Réception']&&'Réception : '+out['Réception'],(out['Idée']||out.Message)&&'Idée : '+(out['Idée']||out.Message)].filter(Boolean).join('\n');
    return{ok:!!(name||email),name,company:out.Entreprise||'',email:email?email[0]:'',phone:out['Téléphone']||out.Phone||'',siret:out.SIRET||'',pro,subject,occasion:out.Occasion||'',qte:Math.max(1,parseInt(qte)||1),details:det};

    </div>
    <div class="mf">${isNew?'':'<button class="btn danger" id="r-del" style="margin-right:auto">Supprimer</button>'}<button class="btn" data-close>Fermer</button><button class="btn primary" id="r-save">Enregistrer</button></div>`);
    const getP=p=>p.split('.').reduce((a,k)=>a==null?a:a[k],r);
    const setP=(p,v)=>{const ks=p.split('.');let a=r;ks.slice(0,-1).forEach(k=>{a[k]=a[k]||{};a=a[k]});a[ks[ks.length-1]]=v};
    $('#modal').querySelectorAll('[data-p]').forEach(i=>i.addEventListener(i.tagName==='SELECT'?'change':'input',()=>{setP(i.dataset.p,i.value);dirty=true;if(i.dataset.p==='acompte'||i.dataset.p.startsWith('client.'))drawMail()}));
    function drawLines(){
      $('#r-lines').innerHTML=r.lines.map((l,i)=>`<tr data-i="${i}"><td><input class="inp" data-k="label" value="${esc(l.label||'')}" placeholder="Désignation"></td><td><input class="inp" type="number" min="0" data-k="qty" value="${esc(l.qty)}"></td><td><input class="inp" type="number" step="0.01" min="0" data-k="price" value="${esc(l.price)}" placeholder="0,00"></td><td class="r" data-sub>${eur(num(l.qty)*num(l.price))}</td><td><button class="del" data-rm>${ic('x',15)}</button></td></tr>`).join('');
      upTot()}
    function upTot(){const t=rTotal(r);$('#r-tot').textContent='Total : '+eur(t)+(num(r.acompte)?` · acompte ${eur(r.acompte)} · reste ${eur(t-num(r.acompte))}`:'')}
    drawLines();
    $('#r-lines').addEventListener('input',e=>{const tr=e.target.closest('tr');const k=e.target.dataset.k;if(!tr||!k)return;const l=r.lines[+tr.dataset.i];l[k]=e.target.value;dirty=true;tr.querySelector('[data-sub]').textContent=eur(num(l.qty)*num(l.price));upTot();drawMail()});
    $('#r-lines').addEventListener('click',e=>{if(!e.target.closest('[data-rm]'))return;r.lines.splice(+e.target.closest('tr').dataset.i,1);if(!r.lines.length)r.lines.push({label:'',qty:'1',price:''});dirty=true;drawLines();drawMail()});
    $('#r-add').addEventListener('click',()=>{r.lines.push({label:'',qty:'1',price:''});dirty=true;drawLines();const ins=$('#r-lines').querySelectorAll('tr:last-child input');if(ins[0])ins[0].focus()});
    function drawMail(){const T=mailTpl(r);
      $('#r-tpl').innerHTML=Object.entries(T).map(([k,[l]])=>`<button data-t="${k}" class="${k===tpl?'on':''}">${l}</button>`).join('');
      const [,s,b]=T[tpl];$('#r-msub').value=s;$('#r-mbody').value=b;updMailto()}
    function updMailto(){const em=(r.client&&r.client.email)||'';$('#r-mailto').href='mailto:'+encodeURIComponent(em).replace(/%40/g,'@')+'?subject='+encodeURIComponent($('#r-msub').value)+'&body='+encodeURIComponent($('#r-mbody').value)}
    drawMail();
    $('#r-tpl').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tpl=b.dataset.t;drawMail()}});
    $('#r-msub').addEventListener('input',updMailto);$('#r-mbody').addEventListener('input',updMailto);
    $('#r-copy').addEventListener('click',()=>copyTxt($('#r-mbody').value,'Message copié : collez-le dans votre e-mail'));
    $('#r-status').addEventListener('change',e=>{const v=e.target.value;if(v!==r.status){r.history.push({at:Date.now(),text:'Statut : '+RLAB[v]});r.status=v;dirty=true;
      if(v==='accepted')tpl='accepted';else if(v==='ready')tpl='ready';else if(v==='done')tpl='thanks';drawMail()}});
    async function persist(){
      const em=(r.client.email||'').trim();if(em&&!validMail(em)){toast('E-mail invalide');return false}
      if(!rName(r)||rName(r)==='Sans nom'){toast('Indiquez le nom du client');return false}
      r.acompte=r.acompte===''||r.acompte==null?'':round2(num(r.acompte));r.updated=Date.now();
      if(isNew&&!r.history.length)r.history.push({at:Date.now(),text:'Demande saisie à la main'});
      upsertR(r);await dbSet('requests',r.id,strip(r));
      const cp={};if(em)cp.email=em;if(r.client.phone)cp.tel=r.client.phone;if(Object.keys(cp).length)await saveClient(rName(r),cp);
      dirty=false;isNew=false;return true}
    $('#r-save').addEventListener('click',async()=>{if(await persist()){toast('Demande enregistrée');closeModal()}});
    async function doc(kind){
      const st=$('#r-st');
      if(!r.lines.some(l=>(l.label||'').trim()&&num(l.price)>0)){st.textContent='Ajoutez au moins une ligne avec une désignation et un prix.';return}
      if(kind==='invoice'&&!r.invoiceNo&&!['accepted','making','ready','done'].includes(r.status)&&!r.orderId){st.textContent='La facture se fait une fois la commande acceptée : passez d\'abord le statut à « Acceptée ».';return}
      st.textContent='Préparation du document…';
      if(kind==='quote'&&!r.quoteNo){r.quoteNo=await nextNumber('quote');r.quoteAt=Date.now();r.history.push({at:Date.now(),text:'Devis '+r.quoteNo+' créé ('+eur(rTotal(r))+')'});if(r.status==='new')r.status='quote';$('#r-status').value=r.status}
      if(kind==='invoice'&&!r.invoiceNo){r.invoiceNo=await nextNumber('invoice');r.invoiceAt=Date.now();r.history.push({at:Date.now(),text:'Facture '+r.invoiceNo+' créée ('+eur(rTotal(r))+')'});
        const o=r.orderId&&byId(orders,r.orderId);if(o&&!o.invoiceNo){o.invoiceNo=r.invoiceNo;o.invoiceAt=r.invoiceAt;await dbUpdate('orders',o.id,{invoiceNo:o.invoiceNo,invoiceAt:o.invoiceAt})}}
      if(!(await persist())){st.textContent='';return}
      tpl=kind;drawMail();
      $('#r-quote').innerHTML=ic('doc',14)+' Télécharger le devis '+esc(r.quoteNo||'');if(r.invoiceNo)$('#r-inv').innerHTML=ic('file',14)+' Télécharger la facture '+esc(r.invoiceNo);
      await savePdf({...r,biz:bizNow()},kind,st);
    }
    $('#r-quote').addEventListener('click',()=>doc('quote').catch(e=>{$('#r-st').textContent='Le document n\'a pas pu être créé. Réessayez.'}));
    $('#r-inv').addEventListener('click',()=>doc('invoice').catch(e=>{$('#r-st').textContent='Le document n\'a pas pu être créé. Réessayez.'}));
    const ro=$('#r-ord');if(ro)ro.addEventListener('click',async()=>{if(dirty&&!(await persist()))return;onClose=null;closeModal();orderView(order)});
    const mk=$('#r-mk');if(mk)mk.addEventListener('click',async()=>{
      const lines=r.lines.filter(l=>(l.label||'').trim()&&num(l.qty)>0);
      if(!lines.length){$('#r-st').textContent='Ajoutez au moins une ligne au devis avant de créer la commande.';return}
      const nextNum=orders.reduce((m,o)=>Math.max(m,num(o.num)),0)+1;
      const o={id:newId('o'),num:nextNum,client:rName(r),email:r.client.email||'',tel:r.client.phone||'',source:r.src==='Saisie'?'Autre':'Site B.Crea',date:today(),statut:'À préparer',
        items:lines.map(l=>({productId:'',name:l.label.trim(),size:'',qty:num(l.qty),prix:round2(num(l.price)),achat:0})),note:[r.subject,r.quoteNo&&'Devis '+r.quoteNo].filter(Boolean).join(' · '),files:[],stockDeducted:false,reqId:r.id,createdAt:new Date().toISOString()};
      if(r.invoiceNo){o.invoiceNo=r.invoiceNo;o.invoiceAt=r.invoiceAt}
      orders.push(o);await dbSet('orders',o.id,strip(o));
      if(num(r.acompte)>0){const p={id:newId('y'),orderId:o.id,client:o.client,date:today(),montant:round2(num(r.acompte)),mode:'Virement',ref:'Acompte'+(r.quoteNo?' devis '+r.quoteNo:''),note:'',files:[],createdAt:new Date().toISOString()};payments.push(p);await dbSet('payments',p.id,strip(p))}
      r.orderId=o.id;r.orderNum=o.num;if(['new','quote'].includes(r.status))r.status='accepted';r.history.push({at:Date.now(),text:'Commande #'+o.num+' créée'});
      if(await persist()){toast('Commande #'+o.num+' créée (onglet Commandes)');onClose=null;closeModal();reqView(r)}});
    const del=$('#r-del');if(del)del.addEventListener('click',e=>armDelete(e.target,async()=>{requests=requests.filter(x=>x.id!==r.id);await dbDel('requests',r.id);toast('Demande supprimée');closeModal()}));
    onClose=()=>{if(dirty&&!isNew){upsertR(r);dbSet('requests',r.id,strip(r))}};
  }
  function upsertR(r){const i=requests.findIndex(x=>x.id===r.id);if(i>=0)requests[i]=r;else requests.push(r)}

  /* --- numérotation, logo, PDF --- */
  async function nextNumber(kind){
    const y=new Date().getFullYear();let c={};
    if(db){try{const d=await db.collection('settings').doc('counters').get();if(d.exists)c={...(d.data()||{})}}catch(e){}}
    if(c.year!==y)c={year:y,quote:0,invoice:0};
    const used=[...requests.map(r=>kind==='quote'?r.quoteNo:r.invoiceNo),...orders.map(o=>kind==='quote'?'':o.invoiceNo)].filter(Boolean).filter(n=>n.includes('-'+y+'-')).map(n=>parseInt(n.split('-').pop())||0);
    c[kind]=Math.max(c[kind]||0,...used)+1;
    if(db)await db.collection('settings').doc('counters').set(c);
    return(kind==='quote'?'D':'F')+'-'+y+'-'+String(c[kind]).padStart(4,'0');
  }
  let logoCache=null;
  function logoJpeg(){if(logoCache)return logoCache;try{const im=document.querySelector('.brand img');const s=Math.min(400,im.naturalWidth||400),h=Math.round(s*(im.naturalHeight||1)/(im.naturalWidth||1));
    const c=document.createElement('canvas');c.width=s;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,s,h);x.drawImage(im,0,0,s,h);
    const bin=atob(c.toDataURL('image/jpeg',0.92).split(',')[1]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);logoCache={bytes:u,w:s,h};return logoCache}catch(e){return null}}
  async function savePdf(o,kind,st){
    const bytes=PDF.buildDocPdf(o,kind,logoJpeg());const no=kind==='quote'?o.quoteNo:o.invoiceNo;
    const fname=`${kind==='quote'?'Devis':'Facture'}-${no}-${fileSlug((o.client&&(o.client.company||o.client.name))||'client')}.pdf`;
    if(!dl){try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}}
    if(!dl){if(st)st.textContent='Le téléchargement n\'est pas disponible dans cette vue. Le numéro '+no+' est enregistré.';return}
    try{await dl.save({filename:fname,data:new Blob([bytes],{type:'application/pdf'})});if(st)st.textContent='Document prêt : '+fname+'. Joignez-le à votre e-mail.'}
    catch(e){if(st)st.textContent=e&&(e.code==='declined'||e.code==='dismissed')?'Téléchargement annulé. Vous pouvez le relancer.':'Le téléchargement a échoué. Réessayez.'}
  }
  async function orderInvoice(o,st){
    const ci=cinfo(o.client),req=o.reqId&&byId(requests,o.reqId);
    if(!o.invoiceNo){
      if(req&&req.invoiceNo){o.invoiceNo=req.invoiceNo;o.invoiceAt=req.invoiceAt}
      else{o.invoiceNo=await nextNumber('invoice');o.invoiceAt=Date.now();if(req){req.invoiceNo=o.invoiceNo;req.invoiceAt=o.invoiceAt;(req.history=req.history||[]).push({at:Date.now(),text:'Facture '+o.invoiceNo+' créée depuis la commande #'+o.num});await dbSet('requests',req.id,strip(req))}}
      await dbUpdate('orders',o.id,{invoiceNo:o.invoiceNo,invoiceAt:o.invoiceAt});
    }
    const c=req?req.client:{name:o.client,email:o.email||ci.email||'',phone:o.tel||ci.tel||''};
    const doc={client:c,kind:req?req.kind:'particulier',subject:req?req.subject:'Commande n° '+o.num,quoteNo:req&&req.quoteNo,invoiceNo:o.invoiceNo,invoiceAt:o.invoiceAt,docNote:req?req.docNote:'',
      lines:(o.items||[]).map(i=>({label:i.name+(i.size?' ('+i.size+')':''),qty:i.qty,price:i.prix})),acompte:round2(paidFor(o)),biz:bizNow()};
    await savePdf(doc,'invoice',st);
  }

  /* ================= SAUVEGARDE / RESTAURATION ================= */
  const ALLCOLS=['products','materials','orders','payments','clients','movements','requests','settings'];
  function assetIds(obj,out){if(Array.isArray(obj))obj.forEach(x=>assetIds(x,out));else if(obj&&typeof obj==='object')Object.entries(obj).forEach(([k,v])=>{if((k==='photos'||k==='files')&&Array.isArray(v))v.forEach(f=>{if(f&&f.id)out.add(f.id)});else assetIds(v,out)});return out}
  const toDataUrl=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ko;r.readAsDataURL(b)});
  async function fromDataUrl(u){return await (await fetch(u)).blob()}
  function backupForm(){
    openModal(`<div class="mh"><h3>${ic('folder',18)} Sauvegarde des données</h3><button class="x" data-close>×</button></div>
    <div class="mb">
      <p style="margin:0 0 8px"><b>Exporter</b> crée un fichier avec tout le contenu de la gestion (stock, matériel, commandes, paiements, clients, demandes, devis, photos et justificatifs). Gardez-le en lieu sûr : il contient les données personnelles des clients.</p>
      <button class="btn primary" id="bk-exp">${ic('file',15)} Exporter une sauvegarde</button>
      <div class="sec">Restaurer</div>
      <p style="margin:0 0 8px">Choisissez un fichier de sauvegarde pour recopier son contenu ici. Les éléments déjà présents avec le même identifiant sont remplacés, les autres sont conservés.</p>
      <label class="btn" style="display:inline-block">${ic('plus',15)} Choisir un fichier…<input type="file" id="bk-file" accept=".json,application/json" hidden></label>
      <div class="clip" id="bk-st" style="margin-top:10px"></div>
    </div>
    <div class="mf"><button class="btn" data-close>Fermer</button></div>`);
    const st=$('#bk-st');
    $('#bk-exp').addEventListener('click',async()=>{
      if(!db){st.textContent='Aucune donnée enregistrée à exporter ici.';return}
      const b=$('#bk-exp');b.disabled=true;
      try{
        const data={app:'bcrea-gestion',version:1,exportedAt:new Date().toISOString(),collections:{},assets:{}};
        for(const c of ALLCOLS){st.textContent='Lecture : '+c+'…';const s=await db.collection(c).get();data.collections[c]=s.docs.map(d=>({id:d.id,data:d.data()}))}
        const ids=[...assetIds(data.collections,new Set())];
        for(const [i,id] of ids.entries()){st.textContent=`Photos et justificatifs : ${i+1} / ${ids.length}…`;
          try{const r=await fetch(blobUrl(id));if(r.ok)data.assets[id]=await toDataUrl(await r.blob())}catch(e){}}
        const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
        if(!dl){try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}}
        if(!dl){st.textContent='Le téléchargement n\'est pas disponible dans cette vue.';return}
        await dl.save({filename:'bcrea-gestion-sauvegarde-'+today()+'.json',data:blob});
        const n=Object.values(data.collections).reduce((a,x)=>a+x.length,0);
        st.textContent=`Sauvegarde prête : ${n} éléments, ${Object.keys(data.assets).length} fichiers${Object.keys(data.assets).length<ids.length?' ('+(ids.length-Object.keys(data.assets).length)+' introuvables)':''}.`;
      }catch(e){st.textContent=e&&(e.code==='declined'||e.code==='dismissed')?'Téléchargement annulé.':'L\'export a échoué. Réessayez.'}
      finally{b.disabled=false}});
    $('#bk-file').addEventListener('change',async e=>{
      const f=e.target.files[0];e.target.value='';if(!f)return;
      if(!db){st.textContent='Connectez-vous d\'abord pour restaurer des données.';return}
      let data;try{data=JSON.parse(await f.text())}catch(_){st.textContent='Ce fichier n\'est pas une sauvegarde valide.';return}
      if(!data||data.app!=='bcrea-gestion'||!data.collections){st.textContent='Ce fichier n\'est pas une sauvegarde de la gestion B.CREA.';return}
      const a=await getAssets();const map={};const ids=Object.keys(data.assets||{});
      for(const [i,id] of ids.entries()){st.textContent=`Envoi des fichiers : ${i+1} / ${ids.length}…`;
        if(!a)break;try{const bl=await fromDataUrl(data.assets[id]);const r=await a.upload(bl,{type:bl.type});map[id]=r.id}catch(_){}}
      let txt=JSON.stringify(data.collections);
      Object.entries(map).forEach(([o,n])=>{if(o!==n)txt=txt.split('"id":"'+o+'"').join('"id":"'+n+'"')});
      const cols=JSON.parse(txt);let n=0,tot=Object.values(cols).reduce((s,x)=>s+(x||[]).length,0);
      for(const c of ALLCOLS){for(const d of (cols[c]||[])){if(!d||!d.id)continue;n++;if(n%10===0)st.textContent=`Restauration : ${n} / ${tot}…`;
        try{await db.collection(c).doc(d.id).set(d.data||{})}catch(_){}}}
      st.textContent=`Restauration terminée : ${n} éléments${ids.length?', '+Object.keys(map).length+' fichiers sur '+ids.length:''}.`;toast('Données restaurées');
    });
  }
  $('#backup').innerHTML=ic('folder',17);$('#backup').addEventListener('click',backupForm);

  /* ================= navigation ================= */
  function route(){const h=(location.hash||'').slice(1);view=['stock','materiel','tarifs','devis','commandes','paiements','recap'].includes(h)?h:'stock';render()}
  window.addEventListener('hashchange',route);
  $('#nav').addEventListener('click',e=>{const a=e.target.closest('a[data-v]');if(!a)return;e.preventDefault();try{history.replaceState(null,'','#'+a.dataset.v)}catch(_){location.hash=a.dataset.v}view=a.dataset.v;render();window.scrollTo(0,0)});
  route();

  /* ================= connexion ================= */
  (async()=>{
    const timer=setTimeout(()=>{$('#sync').textContent=document.getElementById('gl')&&!document.getElementById('gl').hidden?'':'Données injoignables pour l\'instant…'},10000);
    try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
    if(!db){clearTimeout(timer);$('#sync').textContent='Mode local';const bn=$('#banner');bn.textContent='Connectez-vous à claude.ai pour que les données soient sauvegardées. Ici, les changements sont perdus à la fermeture.';bn.classList.add('show');return}
    try{assets=await window.claude.use('assets')}catch(e){assets=null}
    const ok=()=>{clearTimeout(timer);$('#sync').innerHTML=ic('check',14)+' Enregistré automatiquement'};
    const onErr=()=>{clearTimeout(timer);$('#sync').textContent='Synchronisation interrompue'};
    db.collection('products').onSnapshot(s=>{if(!s.metadata.fromCache)ok();products=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},onErr);
    db.collection('orders').onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},onErr);
    db.collection('payments').onSnapshot(s=>{payments=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},onErr);
    db.collection('materials').onSnapshot(s=>{materials=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},()=>{});
    db.collection('requests').onSnapshot(s=>{requests=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},()=>{});
    db.collection('settings').onSnapshot(s=>{const b=s.docs.find(d=>d.id==='biz');biz=b?b.data():{}},()=>{});
    db.collection('clients').onSnapshot(s=>{cdir=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},()=>{});
    db.collection('movements').orderBy('at','desc').limit(120).onSnapshot(s=>{moves=s.docs.map(d=>d.data());safeRender()},()=>{});
  })();
})();
</script>
